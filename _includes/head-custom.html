<script>
  (function() {
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  function initMermaid() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    mermaid.initialize({
      startOnLoad: false,
      theme: isDark ? 'dark' : 'default',
      securityLevel: 'loose'
    });

    const mermaidCodes = document.querySelectorAll('.language-mermaid, pre.mermaid');
    mermaidCodes.forEach(el => {
      const code = el.querySelector('code') ? el.querySelector('code').textContent : el.textContent;
      const container = document.createElement('div');
      container.className = 'mermaid-container';
      const pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = code.trim();
      container.appendChild(pre);

      const targetToRemove = (el.tagName.toLowerCase() === 'code' && el.parentElement && el.parentElement.tagName.toLowerCase() === 'pre')
        ? el.parentElement
        : el;
      if (targetToRemove && targetToRemove.parentNode) {
        targetToRemove.parentNode.replaceChild(container, targetToRemove);
      }
    });

    if (document.querySelectorAll('.mermaid').length > 0) {
      mermaid.run({ querySelector: '.mermaid' }).catch(err => console.debug('Mermaid:', err));
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMermaid);
  } else {
    initMermaid();
  }
</script>

<script>
  // Processamento de sintaxe Obsidian (links [[...]] e imagens ![[...]])
  function renderObsidianSyntax() {
    const content = document.querySelector('.markdown-body');
    if (!content) return;

    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (!node.nodeValue) return NodeFilter.FILTER_REJECT;
        const p = node.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        const tag = p.tagName.toLowerCase();
        if (['pre', 'code', 'script', 'style', 'textarea', 'a'].includes(tag)) {
          return NodeFilter.FILTER_REJECT;
        }
        return node.nodeValue.includes('[[') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
      }
    });

    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    const regex = /(!?)\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
    nodes.forEach(node => {
      const text = node.nodeValue;
      if (!regex.test(text)) return;
      regex.lastIndex = 0;

      const fragment = document.createDocumentFragment();
      let lastIdx = 0;
      let match;

      while ((match = regex.exec(text)) !== null) {
        if (match.index > lastIdx) {
          fragment.appendChild(document.createTextNode(text.slice(lastIdx, match.index)));
        }

        const isImg = match[1] === '!';
        const target = match[2].trim();
        const extra = match[3] ? match[3].trim() : '';

        if (isImg) {
          const img = document.createElement('img');
          let src = target;
          if (!src.includes('/')) {
            src = 'assets/' + src;
          }
          img.src = src;
          img.alt = target;
          if (extra && !isNaN(extra)) {
            img.style.width = extra + 'px';
          }
          img.style.maxWidth = '100%';
          fragment.appendChild(img);
        } else {
          const a = document.createElement('a');
          const label = extra || target;
          let href = target;
          if (href.endsWith('.md')) {
            href = href.replace(/\.md$/, '');
          }
          if (!href.startsWith('http') && !href.startsWith('/') && !href.startsWith('.')) {
            href = href + '/';
          }
          a.href = href;
          a.textContent = label;
          a.className = 'obsidian-link';
          fragment.appendChild(a);
        }

        lastIdx = regex.lastIndex;
      }

      if (lastIdx < text.length) {
        fragment.appendChild(document.createTextNode(text.slice(lastIdx)));
      }

      if (node.parentNode) {
        node.parentNode.replaceChild(fragment, node);
      }
    });

    // Ajusta imagens markdown com largura no alt: ![alt|338](src)
    content.querySelectorAll('img').forEach(img => {
      if (img.alt) {
        const widthMatch = img.alt.match(/\|(\d+)$/);
        if (widthMatch) {
          img.style.width = widthMatch[1] + 'px';
          img.style.maxWidth = '100%';
        }
      }
    });

    // Normaliza links para arquivos .md gerados pelo Jekyll
    content.querySelectorAll('a').forEach(a => {
      let href = a.getAttribute('href');
      if (href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('mailto:')) {
        if (href.endsWith('README.md')) {
          a.setAttribute('href', href.replace(/README\.md$/, ''));
        } else if (href.endsWith('.md')) {
          a.setAttribute('href', href.replace(/\.md$/, '.html'));
        }
      }
    });
  }

  // Inicialização de KaTeX para fórmulas matemáticas
  function initKaTeX() {
    if (typeof renderMathInElement === 'function') {
      renderMathInElement(document.body, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true }
        ],
        throwOnError: false,
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      });
    } else {
      setTimeout(initKaTeX, 60);
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    // 1. Processar links e imagens Obsidian
    renderObsidianSyntax();

    // 2. Renderizar fórmulas KaTeX
    initKaTeX();

    // 3. Controle do tema claro/escuro
    const toggle = document.getElementById('theme-toggle');
    if (toggle) {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      toggle.checked = (currentTheme === 'dark');

      toggle.addEventListener('change', function() {
        const nextTheme = toggle.checked ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', nextTheme);
        localStorage.setItem('theme', nextTheme);
      });
    }

    // 4. Controle do menu mobile (hambúrguer)
    const menuToggle = document.getElementById('menu-toggle');
    const mobileNav = document.getElementById('mobile-nav');
    if (menuToggle && mobileNav) {
      menuToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
        menuToggle.setAttribute('aria-expanded', String(!isExpanded));
        mobileNav.classList.toggle('is-open', !isExpanded);
      });

      // Fechar menu ao clicar em qualquer item
      mobileNav.querySelectorAll('.mobile-nav-item').forEach(function(item) {
        item.addEventListener('click', function() {
          menuToggle.setAttribute('aria-expanded', 'false');
          mobileNav.classList.remove('is-open');
        });
      });

      // Fechar menu ao clicar fora
      document.addEventListener('click', function(e) {
        if (!mobileNav.contains(e.target) && !menuToggle.contains(e.target)) {
          if (mobileNav.classList.contains('is-open')) {
            menuToggle.setAttribute('aria-expanded', 'false');
            mobileNav.classList.remove('is-open');
          }
        }
      });
    }
  });
</script>
